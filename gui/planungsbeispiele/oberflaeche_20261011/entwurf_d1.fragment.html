function restore(saved){const s=saved?.privateContent?.state;if(!s)return;for(const k of ['page','goal','site','profile','view','day']){const valid={page:['analyse','sensitivitaet','vergleich','quellen','export'],goal:['szenarien','betrieb'],site:Object.keys(names),profile:Object.keys(profiles),view:['cost','lcoh','capacity','emissions'],day:Object.keys(data.daily)}[k];if(valid.includes(s[k]))state[k]=s[k];}if(Array.isArray(s.sites)&&s.sites.length&&s.sites.every(x=>names[x]))state.sites=s.sites;if(Array.isArray(s.profiles)&&s.profiles.length&&s.profiles.every(x=>profiles[x]))state.profiles=s.profiles;for(const k of ['cumulative','opened'])if(typeof s[k]==='boolean')state[k]=s[k];}
restore(window.openai?.widgetState);
function plot(id,series,xlabel,ylabel,reference=null){charts.push({id,series,xlabel,ylabel,reference});return `<div class="h2-plot" id="${id}" role="img" aria-label="${ylabel}; ${xlabel}"></div><div class="h2-legend">${series.map(s=>`<span><i style="background:var(${s.color})"></i>${s.name}</span>`).join('')}</div>`;}
function draw(c){const el=root.querySelector('#'+c.id);if(!el)return;const w=Math.max(260,el.clientWidth),h=255,l=58,r=15,t=22,b=47;const points=c.series.flatMap(s=>s.points),xmin=Math.min(...points.map(p=>p[0])),xmax=Math.max(...points.map(p=>p[0]));const ymax=Math.max(0.01,...points.map(p=>p[1]),c.reference??0)*1.12;const x=v=>l+(v-xmin)/(xmax-xmin||1)*(w-l-r),y=v=>h-b-v/ymax*(h-t-b);const ticks=w<430?[xmin,(xmin+xmax)/2,xmax]:[...new Set(points.map(p=>p[0]))].filter((_,i,a)=>a.length<=6||i%6===0||i===a.length-1);let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img"><title>${c.ylabel} nach ${c.xlabel}</title><rect x="${l}" y="${t}" width="${w-l-r}" height="${h-t-b}" fill="none" stroke="var(--h2-line)"/>`;
for(let i=0;i<=4;i++){const v=ymax*i/4;svg+=`<line x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--h2-line)"/><text x="${l-7}" y="${y(v)+4}" text-anchor="end">${fmt(v,v>=100?0:1)}</text>`;}
ticks.forEach(v=>svg+=`<text x="${x(v)}" y="${h-b+20}" text-anchor="${v===xmin?'start':v===xmax?'end':'middle'}">${Number.isInteger(v)?v:fmt(v,1)}</text>`);
if(c.reference!==null)svg+=`<line x1="${l}" x2="${w-r}" y1="${y(c.reference)}" y2="${y(c.reference)}" stroke="var(--h2-text)" stroke-dasharray="6 4"/><text x="${w-r-3}" y="${y(c.reference)-7}" text-anchor="end">Referenz ${fmt(c.reference,3)}</text>`;
c.series.forEach((s,si)=>{svg+=`<path d="${s.points.map((p,i)=>(i?'L':'M')+x(p[0])+','+y(p[1])).join(' ')}" fill="none" stroke="var(${s.color})" stroke-width="2" ${s.dashed?'stroke-dasharray="5 4"':''}/>`;if(s.points.length<=6)s.points.forEach(p=>svg+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3.5" fill="var(${s.color})"><title>${s.name}: ${fmt(p[1])} bei ${p[0]}</title></circle>`);});
svg+=`<text x="${l}" y="14">${c.ylabel}</text><text x="${(l+w-r)/2}" y="${h-6}" text-anchor="middle">${c.xlabel}</text></svg>`;el.innerHTML=svg;}
function bars(id,rows,field,title,reference=null){const max=Math.max(...rows.map(r=>r[field]),reference??0,0.1)*1.12;return `<h3>${title}</h3><div class="h2-panel" style="margin-top:0"><div style="display:grid;grid-template-columns:30px minmax(0,1fr) 62px;gap:9px;margin:14px 0"><div style="display:grid;gap:14px">${rows.map(r=>`<span style="height:22px">${r.scenario}</span>`).join('')}</div><div style="position:relative;display:grid;gap:14px">${rows.map(r=>`<div style="height:22px;background:var(--h2-bg)"><div style="height:22px;width:${100*r[field]/max}%;background:var(--h2-${r.scenario.toLowerCase()})"></div></div>`).join('')}${reference===null?'':`<span aria-hidden="true" style="position:absolute;left:${100*reference/max}%;height:100%;top:0;border-left:2px dashed var(--h2-text)"></span>`}</div><div style="display:grid;gap:14px">${rows.map(r=>`<span style="height:22px">${fmt(r[field],2)}</span>`).join('')}</div></div>${reference===null?'':`<div class="h2-small">┆ Gestrichelte Referenz: ${fmt(reference,3)} kg CO₂e/kg H₂</div>`}<div class="h2-small">kg CO₂e/kg gelieferter H₂ · Balken ab null</div></div>`;}
function buttons(views){return `<div class="h2-row h2-tabs" aria-label="Ergebnisansicht">${views.map(([k,l])=>`<button type="button" data-view="${k}" aria-pressed="${state.view===k}">${l}</button>`).join('')}</div>`;}
function table(rows){return `<details><summary>Werte und konkrete Fälle</summary><div class="h2-table"><table><thead><tr><th>Fall</th><th>Nachfrage</th><th>Jahreskosten<br>Mio. EUR/a</th><th>LCOH<br>EUR/kg</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.scenario} · ${r.profile}</td><td>${r.percent} %</td><td>${fmt(r.cost/1e6)}</td><td>${fmt(r.lcoh,3)}</td></tr>`).join('')}</tbody></table></div></details>`;}
function sourceFooter(){return `<details><summary>Modellprüfung und Herkunft</summary><p>Vorhandene native Ergebnisse; die Vorschau führt keine neue Validierung durch. Eigene Prüfnachweise, Ausführungen und Rohdaten bleiben in der späteren App direkt am Ergebnis zugänglich.</p><p>Historisches Betriebsjahr 2024 · reale EUR 2023 · WACC-Proxy 2021 · H₂ am 300-bar-Lieferpunkt.</p></details>`;}
function demand(){const count=state.sites.length*state.profiles.length*15;let html=`<h2>Wie wirkt eine andere H₂-Nachfrage?</h2><p class="h2-muted">Die Lieferzeiten bleiben gleich. Für jede Menge wird die Anlage neu ausgelegt.</p><section class="h2-panel"><div class="h2-grid"><fieldset><legend>Standorte</legend>${Object.entries(names).map(([k,v])=>`<label class="h2-check"><input type="checkbox" data-site="${k}" ${state.sites.includes(k)?'checked':''}>${v}</label>`).join('')}</fieldset><fieldset><legend>Lieferprofile</legend>${Object.entries(profiles).map(([k,v])=>`<label class="h2-check"><input type="checkbox" data-profile="${k}" ${state.profiles.includes(k)?'checked':''}>${v}</label>`).join('')}</fieldset></div><fieldset><legend>Jahresnachfrage · 100 % = 3.650.000 kg/a</legend><div class="h2-chips">${[50,75,100,125,150].map(p=>`<span class="h2-chip">${p} %${p===100?' · Basis':''}</span>`).join('')}</div></fieldset><div class="h2-small">S0 Referenz · S1 Monatlich · S2 Stündlich · SciPy/HiGHS</div><details><summary>Weitere Einstellungen</summary><p>Im vollständigen Entwurf: eigene Mengenstufen und Bereiche, sämtliche freigegebenen OAT-Parameter, S3, Solver und native Basiskonfiguration. Diese Vorschau zeigt die vorhandenen fünf Nachfragestufen.</p></details><div class="h2-summary"><strong>${count} gespeicherte Modellfälle</strong><p class="h2-small">${state.sites.length} Standort(e) × ${state.profiles.length} Profil(e) × 3 Szenarien × 5 Mengen · 0 neue Berechnungen</p><div class="h2-row"><button class="h2-primary" type="button" id="h2-open" ${count?'':'disabled'}>Ergebnisse ansehen</button><button type="button" disabled>Neu berechnen · erst nach Umsetzung</button></div></div></section>`;
if(!state.opened||!count)return html;
if(!state.sites.includes(state.site))state.site=state.sites[0];if(!state.profiles.includes(state.profile))state.profile=state.profiles[0];const rows=data.demand.filter(r=>r.site===state.site&&r.profile===state.profile);exportRows=rows;exportLabel=`Nachfrage 50–150 % · ${names[state.site]} · ${state.profile} · S0/S1/S2`;
html+=`<section class="h2-panel"><div class="h2-titleline"><h3>Ergebnisse der Nachfrageuntersuchung</h3><span class="h2-tag">Vorhandene Studie</span></div><div class="h2-row">${select('h2-site','Angezeigter Standort',Object.fromEntries(state.sites.map(k=>[k,names[k]])),state.site)}${select('h2-profile','Angezeigtes Lieferprofil',Object.fromEntries(state.profiles.map(k=>[k,profiles[k]])),state.profile)}</div>`;
html+=buttons([['cost','Jahreskosten'],['capacity','Auslegung'],['lcoh','LCOH']]);
const field=state.view==='lcoh'?'lcoh':state.view==='capacity'?'pem':'cost',unit={cost:'Mio. EUR 2023/a',pem:'PEM-Leistung [MW]',lcoh:'EUR 2023/kg H₂'}[field];const series=Object.keys(scenarios).map(s=>({name:scenarios[s],color:'--h2-'+s.toLowerCase(),points:rows.filter(r=>r.scenario===s).sort((a,b)=>a.percent-b.percent).map(r=>[r.percent,field==='cost'?r.cost/1e6:r[field]])}));
html+=plot('h2-demand-plot',series,'Jahresnachfrage [% der Basis]',unit);if(field==='pem')html+=`<p class="h2-small">Beispielansicht PEM. PV, Wind, Kompressor und Speicher bleiben im vollständigen Entwurf getrennt nach MW und t erreichbar.</p>`;
html+=`<p class="h2-note">Das lineare Modell enthält keine Größendegression. Jahreskosten und Kapazitäten können proportional steigen, während LCOH nahezu konstant bleiben.</p>`+table(rows)+sourceFooter()+`</section>`;return html;}
function scenario(){const rows=data.scenarios.filter(r=>r.site===state.site);exportRows=rows;exportLabel=`Basisfälle · ${names[state.site]} · D0 · S0/S1/S2`;
let html=`<h2>Was bewirken die Stromregeln?</h2><p class="h2-muted">Gleicher Standort, D0 und 3.650.000 kg H₂/a. Nur S0/S1/S2 verändern sich.</p><section class="h2-panel"><div class="h2-row">${select('h2-site','Standort',names,state.site)}<div class="h2-select"><span>Lieferprofil</span><strong>D0 · Rund um die Uhr</strong></div></div><div class="h2-summary">3 gespeicherte Basisfälle · reale EUR 2023 · SciPy/HiGHS</div></section>`;
html+=buttons([['cost','Kosten'],['emissions','Emissionen']]);
if(state.view==='emissions'){html+=bars('op',rows,'operational','Betriebliche Stromemissionsintensität');html+=bars('reg',rows,'regulatory','Regulatorische elektrische Teilintensität',rows[0].limit);html+=`<p class="h2-note">Produktgrenzwert als Referenz; dargestellt ist nur die elektrische Teilbilanz. Regulatorische Null bedeutet keine physische Emissionsfreiheit.</p>`;}
else{html+=`<div class="h2-table"><table><caption>LCOH des ausgewählten Szenarienvergleichs</caption><thead><tr><th>Szenario</th><th>LCOH [EUR 2023/kg H₂]</th><th>Jahreskosten [Mio. EUR/a]</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${scenarios[r.scenario]}</td><td>${fmt(r.lcoh,3)}</td><td>${fmt(r.cost/1e6)}</td></tr>`).join('')}</tbody></table></div>`;}return html+sourceFooter();}
function daily(){let rows=data.daily[state.day],series;const keys=['pv','wind','grid','total'];if(state.cumulative){series=keys.map(k=>{let sum=0;return {name:{pv:'Solar direkt',wind:'Wind direkt',grid:'Netzbezug',total:'Strombedarf gesamt'}[k],color:k==='total'?'--h2-text':'--h2-'+k,dashed:k==='total',points:[[0,0],...rows.map((r,i)=>[i+1,sum+=r[k]])]};});}else{series=keys.map(k=>({name:{pv:'Solar direkt',wind:'Wind direkt',grid:'Netzbezug',total:'Strombedarf gesamt'}[k],color:k==='total'?'--h2-text':'--h2-'+k,dashed:k==='total',points:rows.map(r=>[r.hour,r[k]])}));}
exportRows=rows;exportLabel=`Hamburg · D0 · S2 · 100 % · ${state.day} · ${state.cumulative?'Kumulativ':'Stündlich'}`;
return `<h2>Wie arbeitet die Anlage an diesem Tag?</h2><p class="h2-muted">Hamburg · D0 · S2 · 100 % Nachfrage · gespeicherter D0-Basisfall</p><section class="h2-panel"><div class="h2-row">${select('h2-day','Tag · Europe/Berlin',Object.fromEntries(Object.keys(data.daily).map(k=>[k,k.split('-').reverse().join('.')])),state.day)}<div class="h2-row"><button type="button" data-cumulative="false" aria-pressed="${!state.cumulative}">Stündlich</button><button type="button" data-cumulative="true" aria-pressed="${state.cumulative}">Kumulativ</button></div></div><p class="h2-small">Direktversorgung · 24 vorhandene Ortsstunden · Basisfall, keine Nachfragevariante</p>${plot('h2-daily-plot',series,'Ortszeit [Stunde]',state.cumulative?'Kumulative Energie [MWh]':'Stundenenergie [MWh/Intervall]')}<p class="h2-note">${state.cumulative?'Summe ab Mitternacht; Endwert entspricht der Tagesenergie.':'Werte pro Stundenintervall; Speicher und H₂-Betrieb erhalten eigene Ansichten.'}</p><details><summary>Tagesdaten und weitere Betriebsansichten</summary><p>Im vollständigen Entwurf: alle verfügbaren Tage, Gesamterzeugung, H₂-Produktion/-Lieferung, Speicher und mehrtägige Zeitfenster. Hier sind drei reale Beispieltage dieses Basisfalls eingebettet.</p></details></section>`+sourceFooter();}
function sources(){return `<h2>Welche Grundlagen gelten?</h2><p class="h2-muted">Aktive EU-Fallstudie · Herkunft und Jahresrollen bleiben sichtbar.</p><div class="h2-table"><table><thead><tr><th>Grundlage</th><th>Referenz</th><th>Bedeutung</th></tr></thead><tbody><tr><td>Wetter und Strompreise</td><td>2024</td><td>Historisches Betriebsjahr · 8.784 Stunden</td></tr><tr><td>Geldbasis</td><td>Reale EUR 2023</td><td>Inflationsbereinigte Kosten und Preise</td></tr><tr><td>Betriebliche Netzemissionen</td><td>2024 · statisch</td><td>Länderreferenz; keine stündliche Intensitätsmessung</td></tr><tr><td>WACC</td><td>Proxy aus 2021</td><td>Standort- und technologiebezogene Finanzierung</td></tr><tr><td>Regulatorische Faktoren</td><td>Eigene normative Referenz</td><td>Getrennte elektrische Teilbilanz</td></tr><tr><td>H₂-Nachfrage</td><td>Synthetisch auf 2024</td><td>Lieferfenster und Jahresmenge als Annahmen</td></tr></tbody></table></div><details><summary>Vollständiger Quellen- und Prüfzugang im Entwurf</summary><p>Originalquellen, native Basiskonfiguration, Input-/Parameter-Hashes, Fallstudien, unabhängige Prüfberichte und Solverprobe bleiben erhalten. Namibia behält seine eigene historische Datenbasis.</p></details>`;}
function compare(){const rows=data.scenarios.filter(r=>r.scenario==='S2');exportRows=rows;exportLabel='Standortvergleich · D0 · S2 · 100 %';return `<h2>Wie unterscheiden sich die Standorte?</h2><p class="h2-muted">D0 · S2 · 3.650.000 kg/a · historische Basis 2024</p><div class="h2-table"><table><thead><tr><th>Standort</th><th>LCOH [EUR 2023/kg]</th><th>Jahreskosten [Mio. EUR]</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${names[r.site]}</td><td>${fmt(r.lcoh,3)}</td><td>${fmt(r.cost/1e6)}</td></tr>`).join('')}</tbody></table></div><section class="h2-panel"><h3>Vergleichsgrundlagen</h3><p>Gleich: Liefermenge, Profil, Szenario und Geldbasis.<br>Standortabhängig: Wetter, Marktpreise, WACC und betriebliche Emissionsreferenz.</p><span class="h2-small">Weitere Fälle und Namibia bleiben im vollständigen Entwurf auswählbar, mit ihren eigenen Annahmen und Einschränkungen.</span></section>`;}
function exports(){return `<h2>Was wird exportiert?</h2><p class="h2-muted">Jeder Export gehört zu einer ausdrücklich benannten Auswertung.</p><section class="h2-panel"><h3>Exportkarte · Entwurfsbeispiel</h3><p>Untersuchung → ausgewählte Fälle → Ansicht → Zeitraum und Einheit</p><div class="h2-row"><button disabled>PNG / SVG der sichtbaren Grafik</button><button disabled>Genau diese Grafikdaten · CSV</button></div><p class="h2-small">Exportanbindung folgt bei der Umsetzung. Die Vorschau verändert keine Projektdateien.</p><details><summary>Weitere erhaltene Exporte</summary><p>Vollständige Ergebnistabelle, native Dateien als ZIP, Metadaten und unabhängiger Prüfnachweis als JSON. Auswahl und Herkunft werden bei jedem Download angezeigt.</p></details></section>`;}
function render(){charts=[];exportRows=[];exportLabel='';notice.textContent='';root.dataset.navigation=design.navigation;root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});let html='';if(state.page==='sensitivitaet')html=demand();else if(state.page==='analyse'){html=`<div class="h2-row h2-tabs"><button type="button" data-goal="szenarien" aria-pressed="${state.goal==='szenarien'}">Stromregeln vergleichen</button><button type="button" data-goal="betrieb" aria-pressed="${state.goal==='betrieb'}">Betrieb ansehen</button></div>`+(state.goal==='betrieb'?daily():scenario());}else if(state.page==='quellen')html=sources();else if(state.page==='vergleich')html=compare();else html=exports();content.innerHTML=html;charts.forEach(draw);}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){state.page=b.dataset.page;state.view='cost';}else if(b.dataset.goal){state.goal=b.dataset.goal;state.view='cost';}else if(b.id==='h2-open')state.opened=true;else if(b.dataset.view)state.view=b.dataset.view;else if(b.dataset.cumulative)state.cumulative=b.dataset.cumulative==='true';else return;render();persist();});
root.addEventListener('change',e=>{const el=e.target;if(el.dataset.site){state.sites=[...root.querySelectorAll('[data-site]:checked')].map(x=>x.dataset.site);state.opened=false;}else if(el.dataset.profile){state.profiles=[...root.querySelectorAll('[data-profile]:checked')].map(x=>x.dataset.profile);state.opened=false;}else if(el.id==='h2-site')state.site=el.value;else if(el.id==='h2-profile')state.profile=el.value;else if(el.id==='h2-day')state.day=el.value;else return;render();persist();});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
render();const observer=new ResizeObserver(()=>charts.forEach(draw));observer.observe(content);
if(typeof Tweak!=='undefined'){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'navigation',{label:'Navigation im Entwurf',options:[{label:'Links',value:'links'},{label:'Oben',value:'oben'}]});}
})();
</script>
